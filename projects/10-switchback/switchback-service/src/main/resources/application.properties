server.address=127.0.0.1
server.port=${SWITCHBACK_PORT:19000}
spring.datasource.url=${SWITCHBACK_DB_URL:jdbc:postgresql://127.0.0.1:19001/switchback}
spring.datasource.username=${SWITCHBACK_DB_USER:switchback}
spring.datasource.password=${SWITCHBACK_DB_PASSWORD:switchback-local-disposable}
spring.datasource.hikari.maximum-pool-size=8
spring.datasource.hikari.connection-timeout=5000
spring.sql.init.mode=never
switchback.auth-mode=${SWITCHBACK_AUTH_MODE:protected}
switchback.issuer=${SWITCHBACK_ISSUER:}
switchback.audience=${SWITCHBACK_AUDIENCE:switchback}
switchback.source-revision=${SWITCHBACK_SOURCE_REVISION:working-tree-unverified}
server.error.include-stacktrace=never
server.tomcat.max-http-form-post-size=16MB
server.tomcat.threads.max=8
server.tomcat.threads.min-spare=2
server.tomcat.max-connections=32
server.tomcat.accept-count=16
server.tomcat.connection-timeout=10s
server.tomcat.keep-alive-timeout=20s
# PostgreSQL statement timeout is set per transaction; socket bounds also cover a stalled network.
spring.datasource.hikari.data-source-properties.connectTimeout=5
spring.datasource.hikari.data-source-properties.socketTimeout=15
spring.datasource.hikari.data-source-properties.tcpKeepAlive=true
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=25s
