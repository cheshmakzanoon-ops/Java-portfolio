name: java-portfolio-switchback
services:
  postgres:
    image: postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    environment:
      POSTGRES_DB: switchback
      POSTGRES_USER: switchback
      POSTGRES_PASSWORD: switchback-local-disposable
    ports:
      - "127.0.0.1:${SWITCHBACK_DB_PORT:-19001}:5432"
    volumes:
      - switchback-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U switchback -d switchback"]
      interval: 2s
      timeout: 2s
      retries: 30
volumes:
  switchback-data:
