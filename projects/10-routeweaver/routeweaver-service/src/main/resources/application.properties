server.address=127.0.0.1
server.port=${ROUTEWEAVER_PORT:19000}
spring.datasource.url=${ROUTEWEAVER_DB_URL:jdbc:postgresql://127.0.0.1:19001/routeweaver}
spring.datasource.username=${ROUTEWEAVER_DB_USER:routeweaver}
spring.datasource.password=${ROUTEWEAVER_DB_PASSWORD:routeweaver-local-disposable}
spring.datasource.hikari.maximum-pool-size=8
spring.datasource.hikari.connection-timeout=5000
spring.sql.init.mode=never
routeweaver.auth-mode=${ROUTEWEAVER_AUTH_MODE:protected}
routeweaver.issuer=${ROUTEWEAVER_ISSUER:}
routeweaver.audience=${ROUTEWEAVER_AUDIENCE:routeweaver}
routeweaver.source-revision=${ROUTEWEAVER_SOURCE_REVISION:working-tree-unverified}
server.error.include-stacktrace=never
server.tomcat.max-http-form-post-size=16MB
server.tomcat.threads.max=8
server.tomcat.threads.min-spare=2
server.tomcat.max-connections=32
server.tomcat.accept-count=16
server.tomcat.connection-timeout=10s
server.tomcat.keep-alive-timeout=20s
