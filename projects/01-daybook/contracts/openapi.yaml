openapi: 3.1.0
info:
  title: Daybook synthetic accounting API
  version: 1.0.0
  description: Amounts are exact decimal strings. Tenant is taken exclusively from a verified JWT claim. Idempotency receipts are retained for the ledger lifetime.
servers:
  - url: http://127.0.0.1:18100
security:
  - bearer: []
paths:
  /health:
    get:
      security: []
      responses:
        '200': {description: Adapter readiness}
  /v1/accounts:
    post:
      description: Requires ledger.write; currency immutable after creation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currency, normalSide, name]
              properties:
                currency: {$ref: '#/components/schemas/Currency'}
                normalSide: {$ref: '#/components/schemas/Side'}
                name: {type: string, minLength: 1, maxLength: 120}
      responses:
        '200': {description: Account UUID}
        '422': {$ref: '#/components/responses/Invalid'}
  /v1/journals:
    post:
      description: Requires ledger.write. Identical retries return the original journalId. A timeout is ambiguous; retry the same key or query its receipt.
      parameters: [{$ref: '#/components/parameters/Key'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Journal'}
      responses:
        '200': {description: Stable journalId}
        '409': {description: IDEMPOTENCY_CONFLICT; key reused for different normalized intent}
        '422': {$ref: '#/components/responses/Invalid'}
        '503': {description: Temporary transaction retry exhaustion; retry same key after backoff}
  /v1/journals/{id}/reversals:
    post:
      description: Requires ledger.write. Creates a new exact full reversal; one per source. Scope for the key is tenant+REVERSE.
      parameters:
        - {$ref: '#/components/parameters/Id'}
        - {$ref: '#/components/parameters/Key'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [date]
              properties: {date: {type: string, format: date}}
      responses:
        '200': {description: Stable reversal journalId}
        '409': {description: Original already reversed or key conflict}
        '422': {$ref: '#/components/responses/Invalid'}
  /v1/accounts/{id}/statement:
    get:
      description: Requires ledger.read. Authoritative immutable source. Reuse snapshot and boundary plus the last row's date/id/line cursor on every subsequent page. Balances are debit-minus-credit, presented by normal side.
      parameters:
        - {$ref: '#/components/parameters/Id'}
        - {in: query, name: afterDate, schema: {type: string, format: date, default: '1900-01-01'}}
        - {in: query, name: afterId, schema: {type: string, format: uuid, default: '00000000-0000-0000-0000-000000000000'}}
        - {in: query, name: afterLine, schema: {type: integer, default: 0}}
        - {in: query, name: boundary, schema: {type: string, format: date-time}}
        - {in: query, name: snapshot, schema: {type: string, maxLength: 16384}}
        - {in: query, name: limit, schema: {type: integer, minimum: 1, maximum: 200, default: 100}}
      responses:
        '200':
          description: Rows ordered by effective_date,id,line_no. Contains consistency, snapshot, boundary, account, rows, next and applied filters. Monetary minor units are strings.
        '422': {$ref: '#/components/responses/Invalid'}
  /v1/requests/{key}:
    get:
      description: Requires ledger.read. Returns operation and stable JSON response per retained receipt; empty list when not committed/visible for this tenant.
      parameters:
        - {in: path, name: key, required: true, schema: {type: string, maxLength: 120}}
      responses:
        '200': {description: Tenant-scoped receipt list; POST and REVERSE are distinct operations}
  /v1/periods/{id}/close:
    post:
      description: Requires ledger.write. Serializes with writers using the period row; rejects later posting.
      parameters: [{$ref: '#/components/parameters/Id'}]
      responses:
        '200': {description: CLOSED}
        '422': {$ref: '#/components/responses/Invalid'}
  /v1/statements:
    post:
      description: Requires ledger.reconcile. UTF-8 CSV header source_id,reference,currency,amount; maximum 1 MiB and 5000 data rows. Invalid UTF-8 returns IMPORT_ENCODING and NUL characters return IMPORT_NUL_BYTE before any import is persisted. Line-oriented CSV permits quoted commas and escaped quotes; multiline fields are rejected visibly. The same content hash returns the same importId.
      requestBody:
        required: true
        content:
          text/csv:
            schema: {type: string, maxLength: 1048576}
      responses:
        '200': {description: Stable importId}
        '413': {description: REQUEST_BYTE_BOUND}
        '422': {$ref: '#/components/responses/Invalid'}
  /v1/reconciliation/{id}:
    get:
      description: Requires ledger.reconcile. Returns source row identities, monetary strings, status and rejection reasons. Status MATCHED,UNMATCHED,AMBIGUOUS,DUPLICATE,INVALID.
      parameters: [{$ref: '#/components/parameters/Id'}]
      responses:
        '200': {description: Tenant-scoped review rows}
  /v1/reconciliation/{id}/{row}/resolve:
    post:
      description: Requires ledger.reconcile. Candidate must have exact currency/signed amount and remain unconsumed. Verified subject is recorded as actor.
      parameters:
        - {$ref: '#/components/parameters/Id'}
        - {in: path, name: row, required: true, schema: {type: integer, minimum: 1}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [journal, line, reason, evidence]
              properties:
                journal: {type: string, format: uuid}
                line: {type: integer, minimum: 1}
                reason: {type: string, minLength: 1, maxLength: 1000}
                evidence: {type: string, minLength: 1, maxLength: 4000}
      responses:
        '200': {description: MATCHED with durable audited decision}
        '422': {$ref: '#/components/responses/Invalid'}
  /v1/reconciliation/{id}/export:
    get:
      description: Requires ledger.reconcile. Quotes all fields and prefixes formula-trigger characters with apostrophe.
      parameters: [{$ref: '#/components/parameters/Id'}]
      responses:
        '200':
          description: Escaped review CSV
          content: {text/csv: {schema: {type: string}}}
  /v1/reports/replay:
    post:
      description: Requires distinct platform scope ledger.system. Rebuilds a separate generation and promotes only after verified source equality. Never truncates live tables.
      responses:
        '200': {description: Promoted generation UUID}
        '422': {description: SHADOW_MISMATCH_RETRY_WITH_NEW_GENERATION; active generation preserved}
  /v1/reports/accounts/{id}:
    get:
      description: Requires ledger.admin. Tenant-scoped reporting balance with explicit generation,pendingEvents,authoritative=false; monetary minor units are strings.
      parameters: [{$ref: '#/components/parameters/Id'}]
      responses:
        '200': {description: Reporting balances and freshness; never silently substitutes for current statements}
  /v1/reports/freshness:
    get:
      description: Requires ledger.admin. Reports active generation, tenant-scoped pendingEvents,authoritative=false.
      responses:
        '200': {description: Explicit reporting lag}
components:
  securitySchemes:
    bearer: {type: http, scheme: bearer, bearerFormat: JWT}
  parameters:
    Key: {in: header, name: Idempotency-Key, required: true, schema: {type: string, minLength: 1, maxLength: 120}}
    Id: {in: path, name: id, required: true, schema: {type: string, format: uuid}}
  responses:
    Invalid:
      description: Terminal validation rejection with structured code; no partial writes
      content:
        application/json:
          schema: {type: object, properties: {code: {type: string}, retry: {type: string}}}
  schemas:
    Currency: {type: string, enum: [CAD, USD, JPY]}
    Side: {type: string, enum: [DEBIT, CREDIT]}
    Journal:
      type: object
      required: [period, date, currency, reference, lines]
      properties:
        period: {type: string, format: uuid}
        date: {type: string, format: date}
        currency: {$ref: '#/components/schemas/Currency'}
        reference: {type: string, maxLength: 120}
        lines:
          type: array
          minItems: 2
          maxItems: 100
          items:
            type: object
            required: [account, side, amount]
            properties:
              account: {type: string, format: uuid}
              side: {$ref: '#/components/schemas/Side'}
              amount: {type: string, maxLength: 64, description: Positive strict decimal string; CAD/USD at most2 decimals, JPY none; at most10^30−1 minor units}
