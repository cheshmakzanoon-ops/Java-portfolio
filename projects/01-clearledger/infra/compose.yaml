name: java-portfolio-clearledger
services:
  postgres:
    image: postgres:18.3-alpine@sha256:54451ecb8ab38c24c3ec123f2fd501303a3a1856a5c66e98cecf2460d5e1e9d7
    environment:
      POSTGRES_DB: clearledger
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: local-only-admin
    ports:
      - "127.0.0.1:${CLEARLEDGER_DB_PORT:-18101}:5432"
    volumes:
      - clearledger-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d clearledger"]
      interval: 2s
      timeout: 2s
      retries: 30
    mem_limit: 512m
volumes:
  clearledger-data:
