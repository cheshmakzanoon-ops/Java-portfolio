name: java-portfolio-clearledger
services:
  postgres:
    image: postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    environment:
      POSTGRES_DB: clearledger
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: local-only-admin
    ports:
      - "127.0.0.1:${CLEARLEDGER_DB_PORT:-18101}:5432"
    volumes:
      - clearledger-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d clearledger"]
      interval: 2s
      timeout: 2s
      retries: 30
    mem_limit: 512m
volumes:
  clearledger-data:
