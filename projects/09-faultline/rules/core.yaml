  "libraryModels": {
    "StringConcatFactory": "union arguments; no implicit branch taint",
    "LambdaMetafactory": "captured taint and supported function pass-through",
    "StringBuilder": "allocation-site object elements",
    "collections": "pass-through with argument-element write summaries",
    "shell": "separate finite shell-marker proof plus tainted argument-array elements; plain Runtime.exec(String) is not a shell rule",
    "unknown": "union receiver/arguments and unknown bit; native/unresolved diagnostics",
    "URI": "java.net.URI factories and accessors pass the taint of their arguments through, like String"
