{
  "model": "faultline-core",
  "version": "1.1.0",
  "rules": [
    {
      "id": "BG-SQL-TEXT",
      "contextMask": 1,
      "sink": "SQL text argument, including prepareStatement SQL text",
      "safe": "separately bound values; fixtures.Safe.sqlIdentifier(String)"
    },
    {
      "id": "BG-SHELL-COMMAND",
      "contextMask": 2,
      "sink": "Runtime.exec(String[]) or ProcessBuilder.start with /bin/sh or sh or /bin/bash and -c",
      "safe": "argument vector without shell; fixtures.Safe.shellToken(String)"
    },
    {
      "id": "BG-PATH-ACCESS",
      "contextMask": 4,
      "sink": "Files.readString/readAllBytes(Path), FileInputStream(String)",
      "safe": "fixtures.Safe.confinedPath(String) trusted confinement contract"
    },
    {
      "id": "BG-CLASS-LOAD",
      "contextMask": 8,
      "sink": "Class.forName(String...) / ClassLoader.loadClass(String...) / Lookup.findClass(String) with an external class name",
      "safe": "fixtures.SafeExtension.className(String) trusted allowlist contract"
    },
    {
      "id": "BG-URL-FETCH",
      "contextMask": 16,
      "sink": "new URL(String), new Socket(String,int) host, HttpRequest.newBuilder(URI) and Builder.uri(URI) with an external destination",
      "safe": "fixtures.SafeExtension.httpUrl(String) trusted allowlist contract"
    },
    {
      "id": "BG-XPATH-QUERY",
      "contextMask": 32,
      "sink": "XPath.evaluate/compile/evaluateExpression with an external expression",
      "safe": "fixtures.SafeExtension.xpathLiteral(String) trusted literal-quoting contract"
    },
    {
      "id": "BG-LDAP-FILTER",
      "contextMask": 64,
      "sink": "DirContext/InitialDirContext.search(name, filter, ...) with an external filter (argument 1)",
      "safe": "fixtures.SafeExtension.ldapValue(String) trusted escaping contract"
    }
  ],
  "sources": [
    "java/lang/System.getenv(Ljava/lang/String;)Ljava/lang/String;",
    "java/lang/System.getProperty(Ljava/lang/String;)Ljava/lang/String;",
