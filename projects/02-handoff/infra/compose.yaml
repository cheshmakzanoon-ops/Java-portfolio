name: java-portfolio-handoff
services:
  postgres:
    image: postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    environment:
      POSTGRES_DB: handoff
      POSTGRES_USER: handoff
      POSTGRES_PASSWORD: disposable-local-only
    ports:
      - "127.0.0.1:${HANDOFF_DB_PORT:-18202}:5432"
    volumes:
      - handoff-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U handoff -d handoff"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  handoff-data:
