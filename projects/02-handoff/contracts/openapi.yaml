openapi: 3.1.0
info:
  title: Handoff
  version: 1.3.0
  description: Finite typed workflow control plane; semantics 3 uses validated typed
    root/context values and predecessor dataflow. Existing semantics 1 and 2 remain pinned; semantics 3 cancellation records an INTEGER forward-lease count.
    Public requests are limited to 8192 UTF-8 bytes. Dispatch, heartbeat, complete,
    and fail requests accept at most 540672 bytes to echo an issued claim, including
    JSON escaping overhead. All worker claim attributes are checked against the current lease.
servers:
- url: http://127.0.0.1:18200
security:
- bearer: []
paths:
  /health:
    get:
      security: []
      responses:
        '200':
          description: Process readiness
        '503':
          description: Workflow storage unavailable
  /v1/definitions:
    post:
      description: Deployer scope; immutable name/version. Returns content hash; conflicting
        content rejected.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Definition'
      responses:
        '200':
          description: Definition hash
        '400':
          $ref: '#/components/responses/Invalid'
        '403':
          description: Deployer permission required
  /v1/executions:
    post:
      description: Operator scope; same key and changed hash/input conflicts.
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Start'
      responses:
        '200':
          description: Execution UUID
        '400':
          $ref: '#/components/responses/Invalid'
  /v1/executions/{id}:
    parameters:
    - $ref: '#/components/parameters/ExecutionId'
    get:
      description: Viewer scope in authenticated tenant. Read-only repeatable snapshot;
        inspection neither schedules work nor acquires an instance write lock.
      responses:
        '200':
          description: Pinned definition hash, semantic version, current state/version, and derived values
        '404':
          description: Missing in authenticated tenant
  /v1/executions/{id}/history:
    parameters:
    - $ref: '#/components/parameters/ExecutionId'
    get:
      description: Viewer scope; at most 10000 bounded events in sequence order.
      responses:
        '200':
          description: Ordered append-only typed history
  /v1/executions/{id}/history/page:
    parameters:
    - $ref: '#/components/parameters/ExecutionId'
    get:
      description: Viewer scope. Read an immutable history prefix without locking writers.
        Omit snapshotVersion on the first page and reuse the returned snapshotVersion
        and nextAfter on every subsequent page. Events appended later are excluded.
        An explicitly requested snapshot may be any retained positive version not
        greater than the current version. Every request rechecks the authenticated tenant.
      parameters:
      - name: after
        in: query
        schema:
          type: integer
          minimum: 0
          maximum: 10000
          default: 0
      - name: snapshotVersion
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 10000
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 100
      responses:
        '200':
          description: Contiguous bounded events and a stable append-only snapshot cursor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HistoryPage'
        '400':
          $ref: '#/components/responses/Invalid'
        '404':
          description: Execution missing in authenticated tenant
  /v1/executions/{id}/signals:
    parameters:
    - $ref: '#/components/parameters/ExecutionId'
    post:
      description: Operator scope; first serialized signal/timer wins. Early/unmatched
        signals are rejected with durable late evidence, never silently buffered.
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Signal'
      responses:
        '200':
          description: Accepted boolean; repeated same-key request returns original
            decision
  /v1/executions/{id}/cancel:
    parameters:
    - $ref: '#/components/parameters/ExecutionId'
    post:
      description: Operator scope; cooperative cancellation waits for outstanding
        leases before reverse-order compensation.
      responses:
        '200':
          description: Cancellation recorded
  /v1/executions/{id}/resolve:
    parameters:
    - $ref: '#/components/parameters/ExecutionId'
    post:
      description: Operator scope; appends an audited APPLIED/NOT_APPLIED decision
        for an unknown task.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Resolution'
      responses:
        '200':
          description: Decision recorded
  /v1/executions/{id}/retry-compensation:
    parameters:
    - $ref: '#/components/parameters/ExecutionId'
    post:
      description: Operator scope; explicit audited new capped retry window for failed
        compensation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Resolution'
      responses:
        '200':
          description: Retry authorization recorded
  /v1/worker/claim:
    post:
      description: Worker scope; bounded SKIP LOCKED claim. Empty does not establish
        execution completion.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClaimRequest'
      responses:
        '200':
          description: Claims with task identity, attempt, generation, and unguessable credential
  /v1/worker/dispatch:
    post:
      description: Worker scope; verifies a complete Claim object then commits intent
        before external I/O.
      requestBody:
        $ref: '#/components/requestBodies/Claim'
      responses:
        '200':
          description: Dispatch authorized
        '409':
          $ref: '#/components/responses/Stale'
  /v1/worker/heartbeat:
    post:
      description: Worker scope; complete Claim object; expired/stale credentials
        rejected.
      requestBody:
        $ref: '#/components/requestBodies/Claim'
      responses:
        '200':
          description: Lease extended ten seconds using database time
        '409':
          $ref: '#/components/responses/Stale'
  /v1/worker/complete:
    post:
      description: Worker scope; body contains claim and result; exact identity and
        current generation required.
      responses:
        '200':
          description: History and next scheduling committed atomically
        '409':
          $ref: '#/components/responses/Stale'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Completion'
  /v1/worker/fail:
    post:
      description: Worker scope; body contains claim, definitive boolean and bounded
        reason. A timeout is not definitive rejection.
      responses:
        '200':
          description: Retry, failure, or uncertainty recorded
        '409':
          $ref: '#/components/responses/Stale'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Failure'
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    ExecutionId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: ^[a-zA-Z0-9_-]+$
  responses:
    Invalid:
      description: Invalid bounded request; RFC 9457 ProblemDetail without stack trace
      content:
        application/problem+json:
          schema:
            type: object
    Stale:
      description: State conflict; STALE_GENERATION implies no history/state change
      content:
        application/problem+json:
          schema:
            type: object
  requestBodies:
    Claim:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Claim'
  schemas:
    HistoryPage:
      type: object
      additionalProperties: false
      required:
      - instance
      - snapshotVersion
      - after
      - nextAfter
      - hasMore
      - events
      properties:
        instance:
          type: string
          format: uuid
        snapshotVersion:
          type: integer
          minimum: 1
          maximum: 10000
        after:
          type: integer
          minimum: 0
          maximum: 10000
        nextAfter:
          type: integer
          minimum: 0
          maximum: 10000
        hasMore:
          type: boolean
        events:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/HistoryEvent'
    HistoryEvent:
      type: object
      additionalProperties: false
      required:
      - sequence
      - type
      - task
      - value
      - at
      - result
      properties:
        sequence:
          type: integer
          minimum: 1
          maximum: 10000
        type:
          type: string
          enum:
          - STARTED
          - COMPLETED
          - TIMER_FIRED
          - SIGNAL
          - FAILED
          - CANCELLED
          - DISPATCHED
          - UNKNOWN_OUTCOME
          - OPERATOR_RESOLVED
          - OPERATOR_RETRY
          - LATE_EVENT
        task:
          type: string
        value:
          type: string
        at:
          type: string
          format: date-time
        result:
          type: array
          maxItems: 128
          items:
            $ref: '#/components/schemas/Value'
    Claim:
      type: object
      additionalProperties: false
      required:
      - instance
      - tenant
      - task
      - activity
      - safety
      - parameters
      - generation
      - attempt
      - worker
      - credential
      - semantics
      - outputType
      properties:
        instance:
          type: string
          format: uuid
        tenant:
          type: string
          maxLength: 64
        task:
          type: string
          maxLength: 69
        activity:
          type: string
        safety:
          type: string
          enum:
          - PURE
          - IDEMPOTENT_WITH_KEY
          - NON_IDEMPOTENT
        parameters:
          type: string
          maxLength: 262144
          description: Exact issued task-input JSON, at most 262144 UTF-8 bytes before outer JSON string escaping
        generation:
          type: integer
          minimum: 1
        attempt:
          type: integer
          minimum: 1
        worker:
          type: string
          maxLength: 64
        credential:
          type: string
          format: uuid
        semantics:
          type: string
          enum:
          - '1'
          - '2'
          - '3'
        outputType:
          type: string
          enum:
          - TEXT
          - INTEGER
          - BOOLEAN
    Resolution:
      type: object
      additionalProperties: false
      required:
      - task
      - reason
      properties:
        task:
          type: string
        decision:
          type: string
          enum:
          - APPLIED
          - NOT_APPLIED
        reason:
          type: string
          minLength: 1
          maxLength: 256
        result:
          type: array
          maxItems: 128
          items:
            $ref: '#/components/schemas/Value'
      description: APPLIED requires a nonempty result of the task output type. NOT_APPLIED
        requires an empty result. Retry-compensation uses task/reason only.
    Definition:
      type: object
      additionalProperties: false
      required:
      - name
      - version
      - nodes
      properties:
        name:
          type: string
          pattern: ^[a-z][a-z0-9-]{0,63}$
        version:
          type: integer
          minimum: 1
        nodes:
          type: array
          minItems: 1
          maxItems: 128
          items:
            type: object
            additionalProperties: false
            required:
            - id
            - kind
            - requires
            - inputType
            - outputType
            - delaySeconds
            properties:
              id:
                type: string
                pattern: ^[a-z][a-z0-9-]{0,63}$
              kind:
                type: string
                enum:
                - ACTIVITY
                - TIMER
                - SIGNAL
                - BRANCH
                - PARALLEL_ALL
              requires:
                type: array
                maxItems: 16
                uniqueItems: true
                items:
                  type: string
              activity:
                type:
                - string
                - 'null'
              safety:
                type:
                - string
                - 'null'
                enum:
                - PURE
                - IDEMPOTENT_WITH_KEY
                - NON_IDEMPOTENT
                - null
              compensation:
                type:
                - string
                - 'null'
              inputType:
                type: string
                enum:
                - TEXT
                - BOOLEAN
                - INTEGER
              outputType:
                type: string
                enum:
                - TEXT
                - BOOLEAN
                - INTEGER
              delaySeconds:
                type: integer
                minimum: 0
                maximum: 604800
              signal:
                type:
                - string
                - 'null'
              expression:
                type:
                - string
                - 'null'
              when:
                type:
                - string
                - 'null'
        variables:
          type: object
          maxProperties: 32
          additionalProperties:
            type: string
            enum:
            - TEXT
            - INTEGER
            - BOOLEAN
    Value:
      oneOf:
      - type: object
        additionalProperties: false
        required:
        - type
        - data
        properties:
          type:
            const: TEXT
          data:
            type: string
            maxLength: 1024
      - type: object
        additionalProperties: false
        required:
        - type
        - data
        properties:
          type:
            const: INTEGER
          data:
            type: integer
            minimum: -9223372036854775808
            maximum: 9223372036854775807
      - type: object
        additionalProperties: false
        required:
        - type
        - data
        properties:
          type:
            const: BOOLEAN
          data:
            type: boolean
    ExecutionInput:
      type: object
      additionalProperties: false
      required:
      - payload
      - context
      properties:
        payload:
          $ref: '#/components/schemas/Value'
        context:
          type: object
          maxProperties: 32
          additionalProperties:
            $ref: '#/components/schemas/Value'
    Output:
      type: object
      additionalProperties: false
      required:
      - outcome
      - values
      properties:
        outcome:
          type: string
          enum:
          - VALUE
          - SKIPPED
          - TIMED_OUT
        values:
          type: array
          maxItems: 128
          items:
            $ref: '#/components/schemas/Value'
      description: VALUE has a nonempty homogeneous vector. SKIPPED/TIMED_OUT have
        no values.
    Start:
      type: object
      additionalProperties: false
      required:
      - definitionHash
      - input
      properties:
        definitionHash:
          type: string
          pattern: ^[a-f0-9]{64}$
        input:
          $ref: '#/components/schemas/ExecutionInput'
    Signal:
      type: object
      additionalProperties: false
      required:
      - name
      - value
      properties:
        name:
          type: string
          maxLength: 64
        value:
          $ref: '#/components/schemas/Value'
    Completion:
      type: object
      additionalProperties: false
      required:
      - claim
      - result
      properties:
        claim:
          $ref: '#/components/schemas/Claim'
        result:
          type: array
          minItems: 1
          maxItems: 128
          items:
            $ref: '#/components/schemas/Value'
    Failure:
      type: object
      additionalProperties: false
      required:
      - claim
      - definitive
      - reason
      properties:
        claim:
          $ref: '#/components/schemas/Claim'
        definitive:
          type: boolean
        reason:
          type: string
          minLength: 1
          maxLength: 256
    ClaimRequest:
      type: object
      additionalProperties: false
      required:
      - worker
      - batch
      - leaseSeconds
      properties:
        worker:
          type: string
          maxLength: 64
        batch:
          type: integer
          minimum: 1
          maximum: 16
        leaseSeconds:
          type: integer
          minimum: 1
          maximum: 120
