name: java-portfolio-tenantshield
services:
  postgres:
    image: postgres:18.3
    environment:
      POSTGRES_DB: tenantshield
      POSTGRES_USER: migration
      POSTGRES_PASSWORD: local-migration-only
    ports: ["127.0.0.1:18503:5432"]
    volumes: [tenantshield-data:/var/lib/postgresql]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U migration -d tenantshield"]
      interval: 2s
      timeout: 2s
      retries: 40
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    command: ["start-dev", "--import-realm", "--http-port=8080", "--hostname=http://127.0.0.1:18502", "--health-enabled=true"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: local-bootstrap
      KC_BOOTSTRAP_ADMIN_PASSWORD: local-bootstrap-only
      JAVA_OPTS_KC_HEAP: -Xms256m -Xmx768m -XX:ActiveProcessorCount=2
    ports: ["127.0.0.1:18502:8080"]
    volumes: ["./realm.json:/opt/keycloak/data/import/realm.json:ro"]
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/9000; printf 'GET /health/ready HTTP/1.0\r\n\r\n' >&3; head -1 <&3 | grep -q 200"]
      interval: 3s
      timeout: 3s
      retries: 120
volumes:
  tenantshield-data:
