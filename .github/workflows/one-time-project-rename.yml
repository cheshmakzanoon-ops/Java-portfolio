name: One-time Java project rename
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-project-rename.yml'
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: true
      - name: Update every tracked project reference
        run: python3 scripts/migrate-project-names.py
      - name: Validate Python tooling
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Validate documentation and source structure
        run: |
          python3 scripts/check-links.py
          python3 scripts/check-architecture.py
          ./scripts/portfolio.sh list
      - name: Commit and push complete migration
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # The workflow token cannot write .github/workflows files. Preserve
          # them in this push; an authorized connected GitHub write follows.
          git restore --source=HEAD --staged --worktree -- .github/workflows/
          git add -A
          git diff --cached --check -- . ':(exclude)projects/**/evidence/**'
          if git diff --cached --quiet; then
            echo "Expected a full project-name migration; no changes detected." >&2
            exit 1
          fi
          git commit -m "refactor: rename all ten Java projects throughout the repository"
          git push origin HEAD:main
