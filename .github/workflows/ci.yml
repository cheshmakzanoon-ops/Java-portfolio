name: CI
on:
  workflow_call:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tooling:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: ./.github/actions/setup-toolchain
      - run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
      - run: python3 scripts/check-links.py
      - run: python3 scripts/container-images.py
      - run: python3 scripts/check-architecture.py
  projects:
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        project: [clearledger, durableflow, quorumkv, pulsestream, tenantshield, matchcore, indexforge, threadlens, byteguard, routeweaver]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: ./.github/actions/setup-toolchain
      - name: Verify ClearLedger runtime ownership
        if: matrix.project == 'clearledger'
        run: |
          python3 projects/01-clearledger/scripts/test-runtime-cache.py
          python3 projects/01-clearledger/scripts/test-lifecycle.py
      - name: Verify PulseStream runtime ownership
        if: matrix.project == 'pulsestream'
        run: python3 projects/04-pulsestream/scripts/test-lifecycle.py
      - name: Verify TenantShield runtime ownership
        if: matrix.project == 'tenantshield'
        run: python3 projects/05-tenantshield/scripts/test_process_lifecycle.py
      - name: Verify RouteWeaver runtime ownership
        if: matrix.project == 'routeweaver'
        run: python3 projects/10-routeweaver/scripts/test-runtime.py
      - name: Verify ByteGuard preparation receipts
        if: matrix.project == 'byteguard'
        run: python3 projects/09-byteguard/scripts/test-build-cache.py
      - run: ./scripts/portfolio.sh verify "${{ matrix.project }}"
      - run: python3 scripts/check-architecture.py
      - run: python3 scripts/check-architecture.py --bytecode "${{ matrix.project }}"
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        if: always()
        with:
          name: tests-${{ matrix.project }}
          path: |
            projects/**/target/surefire-reports/
            projects/**/target/site/jacoco/
  showcase:
    # A fresh checkout must run at least one real project demo, not just compile tests.
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: ./.github/actions/setup-toolchain
      - name: Execute MatchCore's exact recovery and accounting assertions
        run: |
          set -euo pipefail
          mkdir -p .work/showcase
          ./scripts/portfolio.sh doctor matchcore
          ./scripts/portfolio.sh demo matchcore 2>&1 | tee .work/showcase/matchcore-demo.log
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        if: always()
        with:
          name: matchcore-showcase
          path: .work/showcase/matchcore-demo.log

  required:
    if: always()
    needs: [projects, tooling, showcase]
    runs-on: ubuntu-24.04
    steps:
      - run: |
          test '${{ needs.projects.result }}' = success
          test '${{ needs.tooling.result }}' = success
          test '${{ needs.showcase.result }}' = success
