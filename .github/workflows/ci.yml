name: CI
on:
  workflow_call:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tooling:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: ./.github/actions/setup-toolchain
      - run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
      - run: python3 scripts/check-links.py
      - run: python3 scripts/container-images.py
      - run: python3 scripts/check-architecture.py
  projects:
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        project: [daybook, handoff, majority, latearrival, gatehouse, thepit, stacks, backtrace, faultline, switchback]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: ./.github/actions/setup-toolchain
      - name: Verify Daybook runtime ownership
        if: matrix.project == 'daybook'
        run: |
          python3 projects/01-daybook/scripts/test-runtime-cache.py
          python3 projects/01-daybook/scripts/test-lifecycle.py
      - name: Verify Late Arrival runtime ownership
        if: matrix.project == 'latearrival'
        run: python3 projects/04-latearrival/scripts/test-lifecycle.py
      - name: Verify Gatehouse runtime ownership
        if: matrix.project == 'gatehouse'
        run: python3 projects/05-gatehouse/scripts/test_process_lifecycle.py
      - name: Verify Switchback runtime ownership
        if: matrix.project == 'switchback'
        run: python3 projects/10-switchback/scripts/test-runtime.py
      - name: Verify Faultline preparation receipts
        if: matrix.project == 'faultline'
        run: python3 projects/09-faultline/scripts/test-build-cache.py
      - run: ./scripts/portfolio.sh verify "${{ matrix.project }}"
      - run: python3 scripts/check-architecture.py
      - run: python3 scripts/check-architecture.py --bytecode "${{ matrix.project }}"
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        if: always()
        with:
          name: tests-${{ matrix.project }}
          path: |
            projects/**/target/surefire-reports/
            projects/**/target/site/jacoco/
  showcase:
    # A fresh checkout must run at least one real project demo, not just compile tests.
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: ./.github/actions/setup-toolchain
      - name: Execute The Pit's exact recovery and accounting assertions
        run: |
          set -euo pipefail
          mkdir -p .work/showcase
          ./scripts/portfolio.sh doctor thepit
          ./scripts/portfolio.sh demo thepit 2>&1 | tee .work/showcase/thepit-demo.log
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        if: always()
        with:
          name: thepit-showcase
          path: .work/showcase/thepit-demo.log

  windows-showcase:
    # Separate Windows portability gate; Linux retains its checksum-pinned JDK baseline.
    timeout-minutes: 35
    runs-on: windows-2025
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Install Java 25
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5.5.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Windows JDK and wrapper preflight
        run: |
          .\scripts\portfolio.ps1 doctor thepit
          if ($LASTEXITCODE -ne 0) { throw "Windows toolchain validation failed" }
      - name: The Pit native Windows verification
        run: |
          .\scripts\portfolio.ps1 verify thepit
          if ($LASTEXITCODE -ne 0) { throw "Windows unit tests failed" }
      - name: The Pit native Windows accounting/recovery demo
        run: |
          .\scripts\portfolio.ps1 demo thepit
          if ($LASTEXITCODE -ne 0) { throw "Windows demo failed" }

  required:
    if: always()
    needs: [projects, tooling, showcase, windows-showcase]
    runs-on: ubuntu-24.04
    steps:
      - run: |
          test '${{ needs.projects.result }}' = success
          test '${{ needs.tooling.result }}' = success
          test '${{ needs.showcase.result }}' = success
          test "${{ needs['windows-showcase'].result }}" = success
