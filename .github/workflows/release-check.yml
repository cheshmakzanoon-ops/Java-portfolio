name: Release acceptance
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    timeout-minutes: 90
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '25.0.4.1+1'
          cache: maven
      - run: python3 scripts/release-audit.py
      - run: ./scripts/portfolio.sh verify all
      - run: python3 scripts/check-architecture.py
      - name: Assert all standalone demos
        run: |
          set -euo pipefail
          for project in clearledger durableflow quorumkv pulsestream tenantshield matchcore indexforge threadlens byteguard routeweaver; do
            trap './scripts/portfolio.sh down "$project"' EXIT
            ./scripts/portfolio.sh up "$project"
            # QuorumKV's demo starts its own three processes on the catalog ports.
            if [[ "$project" == quorumkv ]]; then
              ./scripts/portfolio.sh down "$project"
            fi
            ./scripts/portfolio.sh demo "$project"
            ./scripts/portfolio.sh reset-demo "$project"
            ./scripts/portfolio.sh down "$project"
            trap - EXIT
          done
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        if: always()
        with:
          name: release-evidence
          path: |
            projects/**/evidence/
            projects/**/target/surefire-reports/
