name: Benchmark
on:
  workflow_dispatch:
    inputs:
      project:
        required: true
        type: choice
        options: [clearledger, durableflow, quorumkv, pulsestream, tenantshield, matchcore, indexforge, threadlens, byteguard, routeweaver]
permissions:
  contents: read
jobs:
  measured-run:
    timeout-minutes: 300
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: ./.github/actions/setup-toolchain
      - name: Run selected reproducible workload alone
        env:
          PROJECT: ${{ inputs.project }}
        run: |
          set -euo pipefail
          path=$(python3 -c 'import json,os; print(next(x["path"] for x in json.load(open("catalog/projects.yaml"))["projects"] if x["slug"]==os.environ["PROJECT"]))')
          ./scripts/portfolio.sh verify "$PROJECT"
          test -f "$path/scripts/benchmark.sh"
          trap './scripts/portfolio.sh down "$PROJECT"' EXIT
          if [[ "$PROJECT" == pulsestream ]]; then
            bash "$path/scripts/prepare-benchmark.sh"
            docker compose -f "$path/infra/compose.yaml" up -d --wait --wait-timeout 180
          fi
          case "$PROJECT" in
            tenantshield|routeweaver)
              ./scripts/portfolio.sh up "$PROJECT"
              ;;
          esac
          case "$PROJECT" in
            clearledger)
              bash "$path/scripts/microbenchmark.sh"
              bash "$path/scripts/benchmark.sh"
              ;;
            durableflow)
              for round in 1 2 3; do
                ./scripts/portfolio.sh reset-demo "$PROJECT"
                ./scripts/portfolio.sh up "$PROJECT"
                bash "$path/scripts/benchmark.sh"
                mkdir -p ".work/benchmark-raw/$PROJECT/run-$round"
                cp -a "$path/evidence" "$path/target/workload-10000.json" ".work/benchmark-raw/$PROJECT/run-$round/"
                gzip -c "$path/target/runtime/provider-effects.log" > ".work/benchmark-raw/$PROJECT/run-$round/provider-effects.log.gz"
                ./scripts/portfolio.sh down "$PROJECT"
              done
              ;;
            pulsestream)
              if [[ "$PROJECT" == pulsestream ]]; then bash "$path/scripts/benchmark-engine.sh"; fi
              for round in 1 2 3; do
                bash "$path/scripts/benchmark.sh"
                mkdir -p ".work/benchmark-raw/$PROJECT/run-$round"
                cp -a "$path/evidence" ".work/benchmark-raw/$PROJECT/run-$round/"
              done
              ;;
            matchcore)
              bash "$path/scripts/jmh.sh"
              for round in 1 2 3; do
                bash "$path/scripts/benchmark.sh" core
                bash "$path/scripts/benchmark.sh" durable
              done
              ;;
            *) bash "$path/scripts/benchmark.sh" ;;
          esac
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        if: always()
        with:
          name: benchmark-raw
          include-hidden-files: true
          path: |
            projects/**/evidence/
            projects/**/target/benchmark*/
            .work/benchmark*/
            .work/A*/benchmark*/
            .work/A*/runtime/durable-*.json
            projects/**/target/performance/
            projects/**/target/microbenchmark/full/
            .work/A04/runtime/durable-full-*/
            .work/A04/runtime/engine-*/
            .work/A05/runtime/http-*.jfr
            .work/A05/runtime/http-server-*.jfr
            projects/**/.runtime/benchmark*/
            projects/**/.runtime/jmh.*/
