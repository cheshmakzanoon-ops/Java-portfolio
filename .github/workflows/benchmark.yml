name: Benchmark
on:
  workflow_dispatch:
    inputs:
      project:
        required: true
        type: choice
        options: [clearledger, durableflow, quorumkv, pulsestream, tenantshield, matchcore, indexforge, threadlens, byteguard, routeweaver]
permissions:
  contents: read
jobs:
  measured-run:
    timeout-minutes: 120
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '25.0.4.1+1'
          cache: maven
      - name: Run selected reproducible workload alone
        env:
          PROJECT: ${{ inputs.project }}
        run: |
          set -euo pipefail
          path=$(python3 -c 'import json,os; print(next(x["path"] for x in json.load(open("catalog/projects.yaml"))["projects"] if x["slug"]==os.environ["PROJECT"]))')
          ./scripts/portfolio.sh verify "$PROJECT"
          test -f "$path/scripts/benchmark.sh"
          timeout 6600 bash "$path/scripts/benchmark.sh"
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        if: always()
        with:
          name: benchmark-raw
          path: |
            projects/**/evidence/
            projects/**/target/benchmark*/
            .work/benchmark*/
