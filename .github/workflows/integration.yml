name: Integration
on:
  workflow_call:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  integration:
    timeout-minutes: 45
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        project: [clearledger, durableflow, quorumkv, pulsestream, tenantshield, matchcore, indexforge, threadlens, byteguard, routeweaver]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: ./.github/actions/setup-toolchain
      - run: docker info
      - run: ./scripts/portfolio.sh integration "${{ matrix.project }}"
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        if: always()
        with:
          name: integration-${{ matrix.project }}
          path: |
            projects/**/target/failsafe-reports/
            projects/**/target/surefire-reports/
